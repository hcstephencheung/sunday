version: '3.8'

services:
  backend:
    image: sunday-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "9001:9001"
    networks:
      - app-network
    volumes:
      - ./backend:/backend
    command: uvicorn app:app --host 0.0.0.0 --port 9001 --reload

  frontend:
    image: sunday-app
    build:
      context: ./frontend
      dockerfile: Dockerfile.${ENV}
    ports:
      - "3001:3001"
    networks:
      - app-network
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules

  caddy:
    image: caddy:2
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-network
    volumes:
      - ./network/Caddyfile.${ENV}:/etc/caddy/Caddyfile
      - ./frontend/dist:/usr/share/caddy
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
