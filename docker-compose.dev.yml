version: '3.8'

# Development stack. Everything is published on loopback only, on Sunday's
# fixed local ports (18001 HTTP, 28001 HTTPS), so it can run next to other
# local stacks: open https://sunday.localhost:28001
# Caddy reaches the backend and frontend over app-network, so their ports are
# not published on the host.

services:
  backend:
    image: sunday-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - app-network
    volumes:
      - ./backend:/backend
    command: uvicorn app:app --host 0.0.0.0 --port 9000 --reload

  frontend:
    image: sunday-app
    build:
      context: ./frontend
      dockerfile: Dockerfile.${ENV}
    environment:
      TAILNET_HOST: ${TAILNET_HOST:-tailnet.invalid}
    networks:
      - app-network
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules

  caddy:
    image: caddy:2
    ports:
      # Same port numbers inside and out; see the global options in Caddyfile.dev.
      - "127.0.0.1:18001:18001"
      - "127.0.0.1:28001:28001"
    environment:
      TAILNET_HOST: ${TAILNET_HOST:-tailnet.invalid}
    networks:
      - app-network
    volumes:
      - ./network/Caddyfile.${ENV}:/etc/caddy/Caddyfile
      - ./frontend/dist:/usr/share/caddy
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  # Remote access over the owner's tailnet (see "Remote access" in README.md).
  # Only started with `--profile tailnet`; run.sh adds it when TS_AUTHKEY is set
  # in .env or the state volume already exists. Publishes no ports.
  tailscale:
    image: tailscale/tailscale:v1.104.4
    profiles: ["tailnet"]
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-sunday}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: ${TS_AUTH_ONCE:-true}
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./network/tailscale-serve.json:/config/serve.json:ro
    networks:
      - app-network
    depends_on:
      - caddy

volumes:
  caddy_data:
  caddy_config:
  tailscale_state:

networks:
  app-network:
    driver: bridge
